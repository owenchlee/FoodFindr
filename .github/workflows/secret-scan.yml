name: Secret scan

# Fails the build if an API key, token, or other credential is committed.
# Runs on every push and pull request, and scans the FULL git history
# (fetch-depth: 0) so a secret can't slip in via an older commit either.
# This runs on GitHub's side, so it can't be skipped by a local setup.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
